  <body>
<main class="game">
      <div class="hud">
        <strong>Car Smash</strong>
        <span><b id="vehicle">Crimson</b> <b id="garage">1/12</b></span>
        <span>Damage <b id="damage">0</b>%</span>
        <span>Hits <b id="hits">0</b></span>
        <span>Score <b id="score">0</b></span>
        <span class="hint" id="hint">Tap the car</span>
      </div>
      <canvas id="game"></canvas>
      <div style="display:flex;gap:8px;align-items:center;">
      <button id="restart" type="button">Restart</button>
      <a href="about.html" style="display:inline-flex;align-items:center;min-height:40px;padding:9px 13px;border:1px solid rgba(255,255,255,0.14);border-radius:8px;background:rgba(255,255,255,0.08);color:#b8bec9;text-decoration:none;font-size:inherit;">Info</a>
    </div>
      <button class="action" id="action" type="button">Smash</button>
    </main>
    <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const vehicleEl = document.getElementById("vehicle");
      const garageEl = document.getElementById("garage");
      const damageEl = document.getElementById("damage");
      const hitsEl = document.getElementById("hits");
      const scoreEl = document.getElementById("score");
      const hintEl = document.getElementById("hint");
      const restartBtn = document.getElementById("restart");
      const actionBtn = document.getElementById("action");

      const STAGE_LABELS = ["Clean", "Dented", "Crumpled", "Crushed", "Flattened"];
      const VEHICLES = [
        { name: "Crimson", sprite: "car-01.webp", color: "#e03a3a", hits: 16 },
        { name: "Ivory", sprite: "car-02.webp", color: "#e8e2d8", hits: 18 },
        { name: "Cobalt", sprite: "car-03.webp", color: "#4a83e0", hits: 20 },
        { name: "Midnight", sprite: "car-04.webp", color: "#5a5a64", hits: 22 },
        { name: "Silver", sprite: "car-05.webp", color: "#c3c6cc", hits: 24 },
        { name: "Voltage", sprite: "car-06.webp", color: "#5fc46a", hits: 26 },
        { name: "Bronze", sprite: "car-07.webp", color: "#c98a52", hits: 28 },
        { name: "Mocha", sprite: "car-08.webp", color: "#a98d78", hits: 30 },
        { name: "Steel", sprite: "car-09.webp", color: "#a8adb6", hits: 32 },
        { name: "Urban", sprite: "car-10.webp", color: "#8b8f9c", hits: 34 },
        { name: "Sunburst", sprite: "car-11.webp", color: "#f5bb2a", hits: 36 },
        { name: "Sturdy", sprite: "car-12.webp", color: "#a06f52", hits: 38 },
      ];
      // floor = where the painted platform sits inside each backdrop, as a fraction of
      // its height, so every stage lands the car's wheels on the pad and not in mid air
      const BACKDROPS = [
        { src: "bg-01.webp", name: "Scrapyard", floor: 0.78, tint: "#0d1116" },
        { src: "bg-02.webp", name: "Foundry", floor: 0.8, tint: "#1a0c07" },
        { src: "bg-03.webp", name: "Tesla Bay", floor: 0.82, tint: "#0a1320" },
        { src: "bg-04.webp", name: "Acid Vat", floor: 0.87, tint: "#0a1408" },
        { src: "bg-05.webp", name: "Press Room", floor: 0.87, tint: "#140d09" },
        { src: "bg-06.webp", name: "Orbital Rig", floor: 0.88, tint: "#080b18" },
        { src: "bg-07.webp", name: "Void Chamber", floor: 0.84, tint: "#0a1018" },
        { src: "bg-08.webp", name: "Glacier Pit", floor: 0.85, tint: "#0a141c" },
        { src: "bg-09.webp", name: "Singularity", floor: 0.82, tint: "#0b0d12" },
      ];

      function loadImage(src) {
        const img = new Image();
        img.addEventListener("error", () => {
          // one retry past the http cache: a truncated copy cached during a deploy would
          // otherwise keep failing to decode on every visit and take the asset out for good
          if (img.retried) return;
          img.retried = true;
          img.src = src + (src.includes("?") ? "&" : "?") + "reload=" + Date.now();
        });
        img.src = src;
        return img;
      }

      function ready(img) {
        return !!img && img.complete && img.naturalWidth > 0;
      }

      // the garage is 12 pieces of full-size art, so only fetch the car in play plus the next
      const carArt = new Array(VEHICLES.length).fill(null);
      const bgArt = new Array(BACKDROPS.length).fill(null);
      function loadCar(i) {
        if (i >= 0 && i < carArt.length && !carArt[i]) carArt[i] = loadImage(VEHICLES[i].sprite);
      }
      function loadBg(i) {
        if (i >= 0 && i < bgArt.length && !bgArt[i]) bgArt[i] = loadImage(BACKDROPS[i].src);
      }

      // alpha lookup so a tap only counts when it actually lands on painted bodywork
      const hitMaps = new Array(VEHICLES.length).fill(null);
      function hitMap(i) {
        if (hitMaps[i]) return hitMaps[i];
        const img = carArt[i];
        if (!ready(img)) return null;
        const w = 160;
        const h = Math.max(1, Math.round((img.naturalHeight / img.naturalWidth) * w));
        const off = document.createElement("canvas");
        off.width = w;
        off.height = h;
        const octx = off.getContext("2d", { willReadFrequently: true });
        octx.drawImage(img, 0, 0, w, h);
        try {
          hitMaps[i] = { w, h, data: octx.getImageData(0, 0, w, h).data };
        } catch (err) {
          hitMaps[i] = { w, h, data: null };
        }
        return hitMaps[i];
      }

      const buf = document.createElement("canvas");
      const bctx = buf.getContext("2d");

      const state = {
        w: 0,
        h: 0,
        t: 0,
        carIndex: 0,
        bgIndex: Math.floor(Math.random() * BACKDROPS.length),
        hits: 0,
        totalHits: 0,
        score: 0,
        damage: 0,
        over: false,
        pendingNext: 0,
        shake: 0,
        hitFlash: 0,
        lastHit: { x: 0, y: 0 },
        particles: [],
        rings: [],
        dents: [],
        glass: [],
        sparks: [],
      };

      loadCar(0);
      loadCar(1);
      loadBg(state.bgIndex);

      restartBtn.addEventListener("click", () => location.reload());
      actionBtn.addEventListener("click", () => {
        const c = carBox();
        smashAt(c.x + rand(-c.w * 0.24, c.w * 0.24), c.y - c.h * rand(0.3, 0.7));
      });

      canvas.addEventListener("pointerdown", (event) => {
        canvas.setPointerCapture?.(event.pointerId);
        const p = pointer(event);
        smashAt(p.x, p.y);
      });

      function resize() {
        const box = canvas.getBoundingClientRect();
        const ratio = devicePixelRatio || 1;
        state.w = Math.max(320, box.width);
        state.h = Math.max(320, box.height);
        canvas.width = Math.floor(state.w * ratio);
        canvas.height = Math.floor(state.h * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function pointer(event) {
        const box = canvas.getBoundingClientRect();
        return { x: event.clientX - box.left, y: event.clientY - box.top };
      }

      function currentCar() {
        return VEHICLES[state.carIndex];
      }

      function backdrop() {
        return BACKDROPS[state.bgIndex];
      }

      function groundY() {
        return state.h * 0.72;
      }

      // x/y is the centre of the wheel line; w/h is the sprite box before crush squash
      function carBox() {
        const img = carArt[state.carIndex];
        const aspect = ready(img) ? img.naturalWidth / img.naturalHeight : 2.05;
        const w = Math.min(state.w * 0.82, state.h * 0.7 * aspect, 470);
        return { x: state.w * 0.5, y: groundY(), w, h: w / aspect };
      }

      function crushAmount() {
        return state.damage / 100;
      }

      // squashed flat, spread wide and tipped a little further with every stage of damage
      function carTransform() {
        const c = carBox();
        const crush = crushAmount();
        return {
          c,
          crush,
          sx: 1 + crush * 0.16,
          sy: 1 - crush * 0.52,
          tilt: Math.sin(state.totalHits * 1.7) * crush * 0.045,
        };
      }

      // screen point -> 0..1 coordinates inside the sprite box
      function toLocal(x, y) {
        const tf = carTransform();
        const dx = x - tf.c.x;
        const dy = y - tf.c.y;
        const cos = Math.cos(-tf.tilt);
        const sin = Math.sin(-tf.tilt);
        const rx = dx * cos - dy * sin;
        const ry = dx * sin + dy * cos;
        return { u: rx / tf.sx / tf.c.w + 0.5, v: ry / tf.sy / tf.c.h + 1 };
      }

      function onCar(x, y) {
        const p = toLocal(x, y);
        if (p.u < 0 || p.u > 1 || p.v < 0 || p.v > 1) return false;
        const map = hitMap(state.carIndex);
        if (!map || !map.data) return true;
        const mx = Math.min(map.w - 1, Math.floor(p.u * map.w));
        const my = Math.min(map.h - 1, Math.floor(p.v * map.h));
        return map.data[(my * map.w + mx) * 4 + 3] > 40;
      }

      function smashAt(x, y) {
        if (state.over || state.pendingNext) return;
        const inside = onCar(x, y);

        state.rings.push({ x, y, r: 10, color: inside ? "#f7b84b" : "#b8bec9", life: 15, max: 15 });
        if (!inside) {
          state.shake = 3;
          hint("Hit the car", "#b8bec9");
          return;
        }

        state.hits += 1;
        state.totalHits += 1;
        state.damage = Math.min(100, Math.round((state.hits / currentCar().hits) * 100));
        state.score += 12 + stage() * 7 + state.carIndex;
        state.shake = 7 + stage() * 2;
        state.hitFlash = 10;
        state.lastHit = { x, y };
        const p = toLocal(x, y);
        state.dents.push({
          u: p.u,
          v: p.v,
          r: rand(11, 23),
          angle: rand(0, Math.PI),
          life: 1,
        });
        if (state.dents.length > 34) state.dents.shift();
        burst(x, y, stageColor(), 16 + stage() * 5);
        addGlass(x, y);
        addSparks(x, y);

        if (state.damage >= 100) {
          state.damage = 100;
          state.pendingNext = 70;
          hint(`${currentCar().name} flattened`, "#73d676");
          crushBurst(carBox());
        } else {
          hint(STAGE_LABELS[stage()], stageColor());
        }
      }

      function stage() {
        return Math.min(4, Math.floor(state.damage / 25));
      }

      function stageColor() {
        return ["#f7b84b", "#ff9b55", "#ff7a45", "#f05d5e", "#73d676"][stage()];
      }

      function hint(text, color) {
        hintEl.textContent = text;
        hintEl.style.color = color;
      }

      function burst(x, y, color, count) {
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = rand(1.4, 6.6);
          state.particles.push({
            x, y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            size: rand(3, 8),
            color,
            life: rand(22, 42),
            max: 42,
          });
        }
      }

      function addGlass(x, y) {
        if (state.damage < 30) return;
        for (let i = 0; i < 5; i++) {
          const a = rand(-Math.PI, 0);
          const sp = rand(1, 4);
          state.glass.push({
            x, y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            r: rand(3, 7),
            life: rand(26, 48),
            max: 48,
          });
        }
      }

      function addSparks(x, y) {
        if (state.damage < 55) return;
        for (let i = 0; i < 7; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = rand(2, 7);
          state.sparks.push({
            x, y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            life: rand(12, 24),
            max: 24,
          });
        }
      }

      function crushBurst(c) {
        const car = currentCar();
        for (let i = 0; i < 46; i++) {
          burst(c.x + rand(-c.w * 0.45, c.w * 0.45), c.y - rand(0, c.h * 0.6), car.color, 1);
        }
        state.rings.push({ x: c.x, y: c.y - c.h * 0.3, r: 28, color: "#73d676", life: 32, max: 32 });
      }

      function rollBackdrop() {
        if (BACKDROPS.length < 2) return;
        let next = Math.floor(Math.random() * (BACKDROPS.length - 1));
        if (next >= state.bgIndex) next += 1;
        state.bgIndex = next;
        loadBg(next);
      }

      function nextCar() {
        if (state.carIndex >= VEHICLES.length - 1) {
          state.over = true;
          hint("All cars flattened", "#73d676");
          return;
        }
        state.carIndex += 1;
        loadCar(state.carIndex + 1);
        rollBackdrop();
        state.hits = 0;
        state.damage = 0;
        state.pendingNext = 0;
        state.hitFlash = 12;
        state.dents = [];
        state.glass = [];
        state.sparks = [];
        state.rings = [];
        state.shake = 10;
        hint(`${currentCar().name} · ${backdrop().name}`, currentCar().color);
      }

      function step() {
        state.t += 1;
        state.shake = Math.max(0, state.shake - 1);
        state.hitFlash = Math.max(0, state.hitFlash - 1);
        if (state.pendingNext) {
          state.pendingNext -= 1;
          if (state.pendingNext <= 0) nextCar();
        }

        updateBits(state.particles, 0.1, 0.92);
        updateBits(state.glass, 0.18, 0.96);
        updateBits(state.sparks, 0.02, 0.9);
        state.rings.forEach((r) => r.life -= 1);
        state.rings = state.rings.filter((r) => r.life > 0);

        vehicleEl.textContent = currentCar().name;
        garageEl.textContent = `${state.carIndex + 1}/${VEHICLES.length}`;
        damageEl.textContent = state.damage;
        hitsEl.textContent = state.hits;
        scoreEl.textContent = state.score;
      }

      function updateBits(list, gravity, drag) {
        list.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= drag;
          p.vy = p.vy * drag + gravity;
          p.life -= 1;
        });
        for (let i = list.length - 1; i >= 0; i--) {
          if (list[i].life <= 0) list.splice(i, 1);
        }
      }

      function draw() {
        const ox = state.shake ? rand(-state.shake, state.shake) : 0;
        const oy = state.shake ? rand(-state.shake, state.shake) : 0;
        ctx.save();
        ctx.translate(ox, oy);
        drawBackground();
        drawStageLight();
        drawCar();
        drawParticles();
        drawGlass();
        drawSparks();
        drawRings();
        ctx.restore();

        if (state.over) drawComplete();
      }

      function drawBackground() {
        const bd = backdrop();
        const img = bgArt[state.bgIndex];
        ctx.fillStyle = bd.tint;
        ctx.fillRect(0, 0, state.w, state.h);

        if (ready(img)) {
          // cover the canvas, then slide the art so its painted platform meets the wheel line
          const scale = Math.max(state.w / img.naturalWidth, state.h / img.naturalHeight);
          const drawW = img.naturalWidth * scale;
          const drawH = img.naturalHeight * scale;
          const x = (state.w - drawW) / 2;
          const y = Math.min(0, Math.max(state.h - drawH, groundY() - bd.floor * drawH));
          ctx.drawImage(img, x, y, drawW, drawH);
        } else {
          const grd = ctx.createLinearGradient(0, 0, state.w, state.h);
          grd.addColorStop(0, "#101114");
          grd.addColorStop(0.55, "#181923");
          grd.addColorStop(1, "#261711");
          ctx.fillStyle = grd;
          ctx.fillRect(0, 0, state.w, state.h);
        }

        // knock the backdrop back so the car reads as the subject, not the scenery
        const veil = ctx.createLinearGradient(0, 0, 0, state.h);
        veil.addColorStop(0, "rgba(6,8,12,0.72)");
        veil.addColorStop(0.5, "rgba(6,8,12,0.34)");
        veil.addColorStop(0.78, "rgba(6,8,12,0.2)");
        veil.addColorStop(1, "rgba(6,8,12,0.6)");
        ctx.fillStyle = veil;
        ctx.fillRect(0, 0, state.w, state.h);

        const vig = ctx.createRadialGradient(
          state.w * 0.5, groundY() - state.h * 0.1, state.w * 0.18,
          state.w * 0.5, groundY() - state.h * 0.1, state.w * 0.82
        );
        vig.addColorStop(0, "rgba(0,0,0,0)");
        vig.addColorStop(1, "rgba(0,0,0,0.55)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, state.w, state.h);
      }

      function drawStageLight() {
        const c = carBox();
        const flash = state.hitFlash / 10;
        const glow = ctx.createRadialGradient(c.x, c.y - c.h * 0.35, 10, c.x, c.y - c.h * 0.35, c.w * 0.78);
        glow.addColorStop(0, `rgba(255,236,196,${0.16 + flash * 0.12})`);
        glow.addColorStop(0.55, "rgba(255,220,160,0.06)");
        glow.addColorStop(1, "rgba(255,220,160,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, state.w, state.h);
      }

      function drawCarShadow(c, crush) {
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.beginPath();
        ctx.ellipse(c.x, c.y - 2, c.w * (0.42 + crush * 0.1), c.h * 0.11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(247,184,75,${0.1 + (state.hitFlash / 10) * 0.1})`;
        ctx.beginPath();
        ctx.ellipse(c.x, c.y - 4, c.w * 0.34, c.h * 0.07, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawCar() {
        const tf = carTransform();
        const c = tf.c;
        const img = carArt[state.carIndex];
        drawCarShadow(c, tf.crush);

        if (!ready(img)) {
          drawLoadingCar(c);
          return;
        }

        const bw = Math.max(2, Math.round(c.w));
        const bh = Math.max(2, Math.round(c.h));
        if (buf.width !== bw || buf.height !== bh) {
          buf.width = bw;
          buf.height = bh;
        } else {
          bctx.clearRect(0, 0, bw, bh);
        }
        bctx.drawImage(img, 0, 0, bw, bh);

        // everything below is painted through the sprite's own alpha, so the damage
        // never bleeds off the bodywork onto the stage
        bctx.save();
        bctx.globalCompositeOperation = "source-atop";
        if (tf.crush > 0) {
          bctx.fillStyle = `rgba(24,14,9,${tf.crush * 0.46})`;
          bctx.fillRect(0, 0, bw, bh);
        }
        drawDents(bw, bh);
        drawCrackLines(bw, bh, tf.crush);
        const flash = state.hitFlash / 10;
        if (flash > 0) {
          bctx.fillStyle = `rgba(255,238,205,${flash * 0.3})`;
          bctx.fillRect(0, 0, bw, bh);
        }
        bctx.restore();

        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(tf.tilt);
        ctx.scale(tf.sx, tf.sy);
        ctx.shadowColor = "rgba(0,0,0,0.85)";
        ctx.shadowBlur = 26;
        ctx.drawImage(buf, -bw / 2, -bh);
        ctx.restore();
      }

      function drawLoadingCar(c) {
        ctx.save();
        ctx.globalAlpha = 0.35 + Math.sin(state.t * 0.08) * 0.1;
        ctx.fillStyle = "#2a2f38";
        ctx.beginPath();
        ctx.ellipse(c.x, c.y - c.h * 0.45, c.w * 0.44, c.h * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawDents(bw, bh) {
        state.dents.forEach((d, i) => {
          const x = d.u * bw;
          const y = d.v * bh;
          bctx.save();
          bctx.translate(x, y);
          bctx.rotate(d.angle);
          const r = d.r * (bw / 470);
          const grd = bctx.createRadialGradient(0, 0, 1, 0, 0, Math.max(2, r));
          grd.addColorStop(0, "rgba(0,0,0,0.5)");
          grd.addColorStop(1, "rgba(0,0,0,0)");
          bctx.fillStyle = grd;
          bctx.beginPath();
          bctx.ellipse(0, 0, r, r * 0.52, 0, 0, Math.PI * 2);
          bctx.fill();
          bctx.strokeStyle = i % 2 ? "rgba(0,0,0,0.42)" : "rgba(255,255,255,0.24)";
          bctx.lineWidth = Math.max(1, 2.4 * (bw / 470));
          bctx.beginPath();
          bctx.ellipse(0, 0, r * 0.82, r * 0.4, 0, 0, Math.PI * 2);
          bctx.stroke();
          bctx.restore();
        });
      }

      function drawCrackLines(bw, bh, crush) {
        if (crush < 0.18) return;
        const s = bw / 470;
        bctx.strokeStyle = "rgba(0,0,0,0.4)";
        bctx.lineWidth = Math.max(1, 2 * s);
        const lines = Math.floor(4 + crush * 13);
        for (let i = 0; i < lines; i++) {
          const x = bw * 0.08 + ((i * 67) % 100) / 100 * bw * 0.84;
          const y = bh * 0.2 + ((i * 41) % 100) / 100 * bh * 0.62;
          bctx.beginPath();
          bctx.moveTo(x, y);
          bctx.lineTo(x + Math.sin(i) * 18 * s, y + (8 + i % 3 * 5) * s);
          bctx.lineTo(x + Math.cos(i * 1.7) * 26 * s, y + (18 + i % 4 * 4) * s);
          bctx.stroke();
        }
      }

      function drawParticles() {
        state.particles.forEach((p) => {
          ctx.globalAlpha = Math.max(0, p.life / p.max);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        });
        ctx.globalAlpha = 1;
      }

      function drawGlass() {
        ctx.fillStyle = "rgba(145,220,240,0.7)";
        state.glass.forEach((g) => {
          ctx.globalAlpha = g.life / g.max;
          ctx.beginPath();
          ctx.moveTo(g.x, g.y - g.r);
          ctx.lineTo(g.x + g.r, g.y + g.r * 0.5);
          ctx.lineTo(g.x - g.r, g.y + g.r);
          ctx.closePath();
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      function drawSparks() {
        ctx.strokeStyle = "#f7b84b";
        ctx.lineWidth = 2;
        state.sparks.forEach((s) => {
          ctx.globalAlpha = s.life / s.max;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - s.vx * 2, s.y - s.vy * 2);
          ctx.stroke();
        });
        ctx.globalAlpha = 1;
      }

      function drawRings() {
        state.rings.forEach((r) => {
          const age = 1 - r.life / r.max;
          ctx.globalAlpha = r.life / r.max;
          ctx.strokeStyle = r.color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.r + age * 42, 0, Math.PI * 2);
          ctx.stroke();
        });
        ctx.globalAlpha = 1;
      }

      function drawComplete() {
        ctx.fillStyle = "rgba(11,12,15,0.38)";
        ctx.fillRect(0, 0, state.w, state.h);
        ctx.fillStyle = "#f4f2ea";
        ctx.font = "800 30px system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("All Cars Flattened", state.w / 2, state.h * 0.26);
        ctx.font = "700 17px system-ui";
        ctx.fillStyle = "#b8bec9";
        ctx.fillText(`Score ${state.score}`, state.w / 2, state.h * 0.26 + 34);
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function loop() {
        step();
        draw();
        requestAnimationFrame(loop);
      }

      resize();
      new ResizeObserver(resize).observe(canvas);
      hint(`${currentCar().name} · ${backdrop().name}`, currentCar().color);
      loop();
    })();
    </script>

  </body>
</html>
