<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap Scout — Webgame Arcades</title>
<meta name="description" content="A Minesweeper-style logic puzzle — use number hints to find every trap and clear the board across three difficulty levels. Play free instantly.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://webgamearcades.com/games/trap-scout/">
<meta property="og:title" content="Trap Scout — Webgame Arcades">
<meta property="og:description" content="A Minesweeper-style logic puzzle — use number hints to find every trap and clear the board across three difficulty levels.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://webgamearcades.com/games/trap-scout/">
<meta property="og:image" content="https://webgamearcades.com/assets/hero-game-portal.png">
<link rel="stylesheet" href="../game-shell.css">
<script src="../game-shell.js"></script>
<style>#diffs { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px }
  #diffs button { min-width: 56px; height: 36px; padding: 0 10px; font-size: .82rem }
  #info { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: .85rem; color: #b8bec9 }
  #board { display: grid; gap: 3px; justify-content: center; margin: 0 auto }
  .cell { display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: 800; cursor: pointer; border: none; color: #f4f2ea; padding: 0;
    background-color: #39414f; background-image: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 1px 2px rgba(0,0,0,.4); transition: background-color .12s, transform .06s }
  .cell:hover { background-color: #47506180 }
  .cell:active { transform: scale(.93) }
  /* opened cells sit flat and dark so a blank one is obviously not a closed one */
  .cell.open { background-color: rgba(255,255,255,.04); background-image: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); cursor: default; transform: none }
  .cell.flag { background-color: #f7b84b; background-image: linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,0)); color: #1b1205 }
  .cell.trap { background-color: #4a1d21; background-image: none; color: #ff9d9d }
  .cell.hit { background-color: #f05d5e; background-image: none; color: #fff; box-shadow: 0 0 12px rgba(240,93,94,.8) }
  /* teal pulse on whatever the last click changed, so the eye can find it */
  .cell.just { animation: cellPing .5s ease-out }
  .cell.last { outline: 2px solid rgba(43,209,196,.9); outline-offset: -2px }
  @keyframes cellPing {
    0% { box-shadow: 0 0 0 3px rgba(43,209,196,.95), 0 0 14px rgba(43,209,196,.7) }
    100% { box-shadow: 0 0 0 0 rgba(43,209,196,0) }
  }
  @media (prefers-reduced-motion: reduce) { .cell.just { animation: none } .cell { transition: none } }
          .cell[data-n="1"] { color: #4f8cff }
  .cell[data-n="2"] { color: #73d676 }
  .cell[data-n="3"] { color: #f05d5e }
  .cell[data-n="4"] { color: #a98bff }
  .cell[data-n="5"] { color: #ff8f3d }
  .cell[data-n="6"] { color: #2bd1c4 }
  .cell[data-n="7"] { color: #f4f2ea }
  .cell[data-n="8"] { color: #b8bec9 }</style>

<script src="/site-chrome.js"></script>
</head>
<body class="game-trap-scout">
<div class="wrap">
  <div class="hud">
    <span class="pill">Trap Scout</span>
    <span>Logic puzzle — Right-click / long-press = ⚑</span>
  </div>
  <div class="stage center">
    <div>
      <p style="margin:0 0 8px;color:#b8bec9;font-size:.85rem">Open every safe cell — right-click or long-press to flag a trap.</p>
      <div id="diffs"></div>
      <div id="info"><span id="fc"></span><span id="ck">0:00</span></div>
      <div id="board"></div>
      <p id="status" style="min-height:24px;color:#2bd1c4;font-weight:800"></p>
    </div>
  </div>
  <button onclick="location.reload()">Restart</button>
  <a href="about.html" style="display:inline-flex;align-items:center;min-height:40px;padding:9px 13px;border:1px solid rgba(255,255,255,0.14);border-radius:8px;background:rgba(255,255,255,0.08);color:#b8bec9;text-decoration:none;font-size:inherit;">Info</a>
</div>
<script>
  const board = document.querySelector("#board");
  const diffs = document.querySelector("#diffs");
  const fcEl = document.querySelector("#fc");
  const ckEl = document.querySelector("#ck");
  const WIN = "Success!", LOSE = "Game Over";
  const CFGS = [{ l: "Easy", c: 8, r: 8, t: 10 }, { l: "Med", c: 10, r: 10, t: 20 }, { l: "Hard", c: 12, r: 10, t: 30 }];
  let C, R, T, cells, rev, flg, done, fresh, sec, tid, px = 30, hitIdx = -1, ci = 0;
  let just = new Set(), lastIdx = -1;   // what the most recent click touched
  function setStatus(t) {
    const el = document.querySelector("#status");
    if (!el) return;
    el.textContent = t;
    el.style.color = t === LOSE ? "#f05d5e" : "#2bd1c4";   // a loss should not read in the win colour
  }
  CFGS.forEach((cfg, i) => {
    const b = document.createElement("button"); b.textContent = cfg.l;
    b.addEventListener("click", () => newGame(i));
    diffs.appendChild(b);
  });
  function newGame(i) {
    const cfg = CFGS[ci = i]; C = cfg.c; R = cfg.r; T = cfg.t;
    cells = Array(C * R).fill(0); rev = Array(C * R).fill(false); flg = Array(C * R).fill(false);
    done = false; fresh = true; hitIdx = -1; sec = 0; clearInterval(tid); ckEl.textContent = "0:00"; setStatus("");
    just = new Set(); lastIdx = -1;
    [...diffs.children].forEach((b, j) => { b.style.background = j === i ? "#2bd1c4" : "#f7b84b"; b.style.color = j === i ? "#0b0c0f" : "#1b1205"; });
    fit();
  }
  function placeMines(safe) {
    const p = Array.from({ length: C * R }, (_, i) => i).filter(i => i !== safe);
    for (let i = 0; i < T; i++) { const j = i + Math.floor(Math.random() * (p.length - i)); [p[i], p[j]] = [p[j], p[i]]; }
    const ms = new Set(p.slice(0, T));
    cells = Array.from({ length: C * R }, (_, i) => ms.has(i) ? -1 : 0);
    for (let i = 0; i < cells.length; i++) { if (cells[i] === -1) continue; cells[i] = nb(i).filter(n => cells[n] === -1).length; }
  }
  function nb(i) {
    const r = Math.floor(i / C), c = i % C, o = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < R && nc >= 0 && nc < C) o.push(nr * C + nc);
    }
    return o;
  }
  function reveal(i) {
    if (done || rev[i] || flg[i]) return;
    if (fresh) {
      fresh = false; placeMines(i);
      tid = setInterval(() => { sec++; const m = Math.floor(sec / 60), s = sec % 60; ckEl.textContent = m + ":" + (s < 10 ? "0" + s : s); }, 1000);
    }
    lastIdx = i;
    if (cells[i] === -1) {
      hitIdx = i; done = true; clearInterval(tid);
      cells.forEach((_, j) => { if (cells[j] === -1) rev[j] = true; }); rev[i] = true;
      just = new Set([i]); draw(); setStatus(LOSE); return;
    }
    const before = rev.slice();
    flood(i);
    just = new Set(rev.reduce((acc, v, j) => (v && !before[j] && acc.push(j), acc), []));
    draw();
    if (rev.filter((v, j) => v && cells[j] !== -1).length === cells.filter(v => v !== -1).length) { done = true; clearInterval(tid); setStatus(WIN); }
  }
  function flood(i) { if (rev[i] || flg[i] || cells[i] === -1) return; rev[i] = true; if (cells[i] === 0) nb(i).forEach(flood); }
  function tog(i) { if (done || rev[i]) return; flg[i] = !flg[i]; just = new Set([i]); lastIdx = i; fcount(); draw(); }
  function fcount() { fcEl.textContent = "⚑ " + (T - flg.filter(Boolean).length); }
  function fit() {
    const stg = board.closest ? board.closest(".stage") : board.parentElement;
    const w = Math.min(stg ? stg.clientWidth : 300, 440);
    // Size from the height budget as well as the width, or the bigger boards
    // push the panel past the stage and the whole thing starts scrolling.
    const panel = board.parentElement;
    const used = panel.getBoundingClientRect().height - board.getBoundingClientRect().height;
    const availH = (stg ? stg.clientHeight : 400) - used - 28;
    const byW = Math.floor((w - 24 - 3 * (C - 1)) / C);
    const byH = Math.floor((availH - 3 * (R - 1)) / R);
    // never shrink below a comfortable tap target; a short window may still
    // scroll a little, which is fine now that the scene paints the whole stage
    px = Math.max(26, Math.min(42, Math.min(byW, byH)));
    board.style.gridTemplateColumns = "repeat(" + C + "," + px + "px)";
    fcount(); draw();
  }
  function draw() {
    board.innerHTML = "";
    const fs = Math.max(9, Math.floor(px * 0.5));
    for (let i = 0; i < C * R; i++) {
      const el = document.createElement("button");
      el.type = "button";
      el.style.cssText = "width:" + px + "px;height:" + px + "px;font-size:" + fs + "px";
      el.className = "cell";
      if (rev[i]) {
        el.classList.add("open");
        if (cells[i] === -1) { el.classList.add(i === hitIdx ? "hit" : "trap"); el.textContent = "✕"; }
        else if (cells[i] > 0) { el.textContent = cells[i]; el.dataset.n = cells[i]; }
      } else if (flg[i]) { el.classList.add("flag"); el.textContent = "⚑"; }
      if (just.has(i)) el.classList.add("just");
      if (i === lastIdx) el.classList.add("last");
      el.addEventListener("contextmenu", e => { e.preventDefault(); tog(i); });
      // Long-press is the touch stand-in for right-click. It must never apply to
      // a mouse: holding the left button a moment too long would flag the cell
      // instead of opening it, which reads as a random wrong click.
      let pt, lp = false, sx = 0, sy = 0;
      el.addEventListener("pointerdown", e => {
        lp = false;
        if (e.pointerType === "mouse" || e.isPrimary === false) return;
        sx = e.clientX; sy = e.clientY;
        pt = setTimeout(() => { lp = true; tog(i); }, 500);
      });
      el.addEventListener("pointermove", e => {
        if (pt && Math.hypot(e.clientX - sx, e.clientY - sy) > 12) { clearTimeout(pt); pt = null; }
      });
      el.addEventListener("pointerup", () => clearTimeout(pt));
      el.addEventListener("pointercancel", () => clearTimeout(pt));
      el.addEventListener("pointerleave", () => clearTimeout(pt));
      el.addEventListener("click", () => { if (!lp) reveal(i); });
      board.appendChild(el);
    }
    just.clear();   // the ping is on the freshly built elements; a resize must not replay it
  }
  window.addEventListener("resize", () => fit());
  newGame(0);
</script>

</body>
</html>
